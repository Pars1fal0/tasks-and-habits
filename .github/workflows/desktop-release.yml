name: Desktop Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build and publish Windows
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package version v$version"
          }

      - name: Run tests
        shell: pwsh
        run: |
          npm test 2>&1 | Tee-Object -FilePath test-output.log
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            $tail = (Get-Content test-output.log -Tail 80) -join "`n"
            $escaped = $tail.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error title=Unit tests failed::$escaped"
            exit $testExit
          }

      - name: Run lint
        run: npm run lint

      - name: Run Electron interaction tests
        shell: pwsh
        run: |
          $testExit = 1
          foreach ($attempt in 1..2) {
            npm run test:e2e 2>&1 | Tee-Object -FilePath e2e-output.log
            $testExit = $LASTEXITCODE
            if ($testExit -eq 0) {
              exit 0
            }
            if ($attempt -lt 2) {
              Write-Warning "Electron E2E attempt $attempt failed; retrying once."
              Start-Sleep -Seconds 5
            }
          }
          $tail = (Get-Content e2e-output.log -Tail 100) -join "`n"
          $escaped = $tail.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
          Write-Output "::error title=Electron interaction tests failed::$escaped"
          exit $testExit

      - name: Verify desktop shell
        run: npm run desktop:smoke

      - name: Verify hosted build
        run: |
          npm run build:web
          npm run build:worker

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Build workflow-dispatch artifacts
        if: github.event_name == 'workflow_dispatch'
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload manual build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ParsiTasks-Windows-${{ github.run_number }}
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: error
